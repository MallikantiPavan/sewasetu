services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      EVAL_RESULTS_PATH: /var/lib/sewasetu/eval-results/latest.json
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
      - ./evals/results:/var/lib/sewasetu/eval-results:ro

  scheduler:
    build: ./app
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

  citizen-mcp:
    build: ./assistant
    command: ["python", "citizen_server.py"]
    ports:
      - "8101:8101"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASSWORD: sewasetu123
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8000}
      OAUTH_JWKS_URL: http://app:8000
      MCP_AUDIENCE: ${CITIZEN_MCP_AUDIENCE:-http://localhost:8101}
      MCP_ALLOWED_BLOCKS: ${MCP_ALLOWED_BLOCKS:-Sonari}
      UPLOAD_DIR: /var/sewasetu/uploads
      SMS_GATEWAY_URL: http://smsgw:8025
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8101
    depends_on:
      - db
      - app
    volumes:
      - uploads:/var/sewasetu/uploads

  officer-mcp:
    build: ./assistant
    command: ["python", "officer_server.py"]
    ports:
      - "8102:8102"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASSWORD: sewasetu123
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8000}
      OAUTH_JWKS_URL: http://app:8000
      MCP_AUDIENCE: ${OFFICER_MCP_AUDIENCE:-http://localhost:8102}
      MCP_ALLOWED_BLOCKS: ${MCP_ALLOWED_BLOCKS:-Sonari}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8102
    depends_on:
      - db
      - app

volumes:
  pgdata:
  uploads:
  applogs:
